<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>即時銷售分析儀表板</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f3f6fb;
      color: #1e293b;
      line-height: 1.6;
    }
    header {
      background: #16324f;
      color: white;
      padding: 28px 20px;
    }
    .container { max-width: 1200px; margin: auto; padding: 20px; }
    header .container { padding: 0; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); }
    nav { display: flex; flex-wrap: wrap; gap: 12px; }
    nav a { color: white; }
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { overflow-wrap: anywhere; }
    #status.error { color: #b91c1c; }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin: 20px 0;
    }
    .stat, .card {
      min-width: 0;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, .06);
    }
    .stat p { margin: 0; color: #64748b; }
    .value {
      display: block;
      margin-top: 8px;
      font-size: clamp(22px, 3vw, 30px);
      color: #16324f;
      overflow-wrap: anywhere;
    }
    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .wide { grid-column: 1 / -1; }
    .card h2 { margin-top: 0; font-size: 20px; }
    .chart { width: 100%; height: 380px; }
    .analysis { color: #475569; }
    footer { padding: 24px; text-align: center; color: #64748b; }
    [hidden] { display: none !important; }
    @media (max-width: 900px) {
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .charts { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .summary { grid-template-columns: 1fr; }
      .container { padding: 12px; }
      .stat, .card { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>即時銷售分析儀表板</h1>
      <p>教學用模擬資料｜每次開啟或重新整理，讀取資料庫最新結果</p>
      <nav aria-label="圖表導覽">
        <a href="#daily-section">每日趨勢</a>
        <a href="#product-section">商品比較</a>
        <a href="#category-section">分類占比</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <button id="refresh" type="button">重新讀取資料</button>
    <p id="status" role="status" aria-live="polite"></p>

    <div id="dashboard" hidden>
      <section class="summary" aria-label="銷售摘要">
        <div class="stat">
          <p>資料筆數</p><strong id="records" class="value">—</strong>
        </div>
        <div class="stat">
          <p>售出數量（含退貨）</p><strong id="quantity" class="value">—</strong>
        </div>
        <div class="stat">
          <p>退貨數量</p><strong id="returns" class="value">—</strong>
        </div>
        <div class="stat">
          <p>淨銷售額</p><strong id="revenue" class="value">—</strong>
        </div>
      </section>

      <div class="charts">
        <section id="daily-section" class="card wide">
          <h2>1. 每日淨銷售額</h2>
          <div id="daily-chart" class="chart"></div>
          <p id="daily-analysis" class="analysis"></p>
        </section>
        <section id="product-section" class="card">
          <h2>2. 各商品淨銷售額</h2>
          <div id="product-chart" class="chart"></div>
          <p id="product-analysis" class="analysis"></p>
        </section>
        <section id="category-section" class="card">
          <h2>3. 各分類淨銷售額占比</h2>
          <div id="category-chart" class="chart"></div>
          <p id="category-analysis" class="analysis"></p>
        </section>
      </div>
    </div>
  </main>

  <footer>淨銷售額＝單價 ×（售出數量－退貨數量）</footer>

  <script>
    const API_URL =
      "https://mysql-sales-dashboard.onrender.com/api/dashboard";

    const button = document.getElementById("refresh");
    const status = document.getElementById("status");
    const dashboard = document.getElementById("dashboard");

    const number = value => Number(value).toLocaleString("zh-TW");
    const money = value => "NT$" + Number(value).toLocaleString(
      "zh-TW", { maximumFractionDigits: 0 }
    );
    const setText = (id, text) => {
      document.getElementById(id).textContent = text;
    };
    const highest = rows => rows.reduce(
      (best, row) => !best || row.net_revenue > best.net_revenue
        ? row : best,
      null
    );

    const config = {
      responsive: true,
      displaylogo: false,
      displayModeBar: false
    };

    function layout(extra = {}) {
      return {
        autosize: true,
        height: 380,
        margin: { l: 65, r: 20, t: 20, b: 60 },
        font: {
          family: "Arial, Microsoft JhengHei, sans-serif",
          color: "#1e293b"
        },
        paper_bgcolor: "white",
        plot_bgcolor: "white",
        ...extra
      };
    }

    async function loadData() {
      button.disabled = true;
      dashboard.hidden = true;
      status.className = "";
      status.textContent =
        "正在讀取最新資料；免費後端若休眠，首次載入可能需要一分鐘以上。";

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 120000);

      try {
        if (!window.Plotly) {
          throw new Error("圖表套件未載入，請確認網路連線後重新整理。");
        }

        const response = await fetch(API_URL, {
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error("API 回應錯誤：" + response.status);
        }

        const data = await response.json();

        if (
          !data.summary ||
          !Array.isArray(data.daily) ||
          !Array.isArray(data.products) ||
          !Array.isArray(data.categories)
        ) {
          throw new Error("API 資料格式不符。");
        }

        const summary = data.summary;

        setText("records", number(summary.record_count));
        setText("quantity", number(summary.total_quantity) + " 件");
        setText("returns", number(summary.total_returns) + " 件");
        setText("revenue", money(summary.net_revenue));

        dashboard.hidden = false;

        // 排序每日資料
        const daily = [...data.daily].sort(
          (a, b) => a.date.localeCompare(b.date)
        );

        // 水平長條圖：最高銷售額顯示於最上方
        const products = [...data.products].sort(
          (a, b) => a.net_revenue - b.net_revenue
        );

        await Promise.all([
          Plotly.react("daily-chart", [{
            x: daily.map(row => row.date),
            y: daily.map(row => row.net_revenue),
            type: "scatter",
            mode: "lines+markers",
            line: { color: "#2563eb" },
            hovertemplate:
              "%{x}<br>淨銷售額：NT$%{y:,.0f}<extra></extra>"
          }], layout({
            xaxis: { title: "日期", type: "date" },
            yaxis: { title: "淨銷售額（元）", tickformat: ",.0f" }
          }), config),

          Plotly.react("product-chart", [{
            x: products.map(row => row.net_revenue),
            y: products.map(row => row.name),
            type: "bar",
            orientation: "h",
            marker: { color: "#14b8a6" },
            hovertemplate:
              "%{y}<br>淨銷售額：NT$%{x:,.0f}<extra></extra>"
          }], layout({
            margin: { l: 95, r: 20, t: 20, b: 60 },
            xaxis: { title: "淨銷售額（元）", tickformat: ",.0f" },
            yaxis: {
              automargin: true,
              categoryorder: "array",
              categoryarray: products.map(row => row.name)
            }
          }), config),

          Plotly.react("category-chart", [{
            labels: data.categories.map(row => row.name),
            values: data.categories.map(row => row.net_revenue),
            type: "pie",
            textinfo: "label+percent",
            textposition: "inside",
            automargin: true,
            hovertemplate:
              "%{label}<br>NT$%{value:,.0f}<br>%{percent}<extra></extra>"
          }], layout({
            margin: { l: 10, r: 10, t: 20, b: 20 },
            showlegend: false
          }), config)
        ]);

        const bestDay = highest(daily);
        const bestProduct = highest(products);
        const bestCategory = highest(data.categories);

        setText("daily-analysis", bestDay
          ? `最高淨銷售額日期：${bestDay.date}，${money(bestDay.net_revenue)}。`
          : "目前沒有資料。");

        setText("product-analysis", bestProduct
          ? `最高淨銷售額商品：${bestProduct.name}，${money(bestProduct.net_revenue)}。`
          : "目前沒有資料。");

        setText("category-analysis",
          bestCategory && Number(summary.net_revenue) > 0
            ? `${bestCategory.name}占比最高，占總淨銷售額的 ${
                (bestCategory.net_revenue / summary.net_revenue * 100)
                .toFixed(1)
              }%。`
            : "目前沒有可計算占比的資料。"
        );

        const time = new Date(data.generated_at).toLocaleString(
          "zh-TW", { timeZone: "Asia/Taipei", hour12: false }
        );

        status.textContent = `讀取成功｜查詢時間：${time}（臺灣時間）`;

      } catch (error) {
        dashboard.hidden = true;
        status.className = "error";
        status.textContent = error.name === "AbortError"
          ? "讀取逾時，請稍後按「重新讀取資料」。"
          : `讀取失敗：${error.message} 請確認 API 與 FRONTEND_ORIGIN 設定。`;

      } finally {
        clearTimeout(timeout);
        button.disabled = false;
      }
    }

    button.addEventListener("click", loadData);
    loadData();
  </script>
</body>
</html>
